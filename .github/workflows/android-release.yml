name: Android APK release

on:
  push:
    tags: ['android-v*']
    # A branch named release/android-vX.Y.Z publishes that release too: the APKs are built from an
    # environment that can push branches but not tags, and the workflow creates the tag itself.
    branches: ['release/android-*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install NDK r30 and CMake (SDK preinstalled on the runner)
        run: |
          SDKM=$(ls -d $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | $SDKM --licenses > /dev/null || true
          $SDKM "ndk;30.0.16248370" "cmake;3.22.1" "platforms;android-34" "build-tools;34.0.0" > /dev/null
          echo "sdk.dir=$ANDROID_HOME" > local.properties
      - name: Release signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > release.jks
            printf 'storeFile=../release.jks\nstorePassword=%s\nkeyAlias=flowframes\nkeyPassword=%s\n' \
              "$KEYSTORE_PASSWORD" "$KEYSTORE_PASSWORD" > keystore.properties
          else
            echo "No release key secret: the APK is signed with the debug key"
          fi
      - name: Build the release APK (Capri)
        # CMake fetches stable-diffusion.cpp (pinned tag) on the first configure and compiles it for
        # arm64: the first CI run of a commit pays a few extra minutes for the diffusion engine.
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          cp app/build/outputs/apk/release/app-release.apk Capri-Android.apk
          if [ -f keystore.properties ]; then
            # Gradle drops the v1 (JAR) signature when minSdk >= 24, but some installers (Honor
            # MagicOS) only read v1 and refuse the APK ("does not contain any certificates").
            # Re-sign with v1 + v2 + v3.
            PW=$(grep '^storePassword=' keystore.properties | cut -d= -f2-)
            $BT/zipalign -f -p 4 Capri-Android.apk aligned.apk
            $BT/apksigner sign --ks release.jks --ks-pass "pass:$PW" --ks-key-alias flowframes \
              --key-pass "pass:$PW" --min-sdk-version 21 --v1-signing-enabled true \
              --v2-signing-enabled true --v3-signing-enabled true --out Capri-Android.apk aligned.apk
            rm -f aligned.apk Capri-Android.apk.idsig
          fi
          $BT/apksigner verify --verbose --print-certs --min-sdk-version 21 Capri-Android.apk | head -8
          $BT/apksigner verify --min-sdk-version 21 -v Capri-Android.apk | grep -q "v1 scheme (JAR signing): true" || [ ! -f keystore.properties ]
          ls -l Capri-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Capri-Android-apk
          path: android/Capri-Android.apk
      - name: Resolve the release tag
        if: startsWith(github.ref, 'refs/tags/android-v') || startsWith(github.ref, 'refs/heads/release/')
        run: |
          if [ "$GITHUB_REF_TYPE" = "branch" ]; then
            echo "RELEASE_TAG=${GITHUB_REF_NAME#release/}" >> "$GITHUB_ENV"
          else
            echo "RELEASE_TAG=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          fi
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/android-v') || startsWith(github.ref, 'refs/heads/release/')
        uses: softprops/action-gh-release@v2
        with:
          # Pushed from a branch (which cannot carry a tag): create the tag at this commit.
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          files: android/Capri-Android.apk
          prerelease: true
          name: Capri ${{ env.RELEASE_TAG }}
          body: |
            Un seul APK arm64 dans cette release : **Capri-Android.apk**. L'édition historique
            FlowFrames disparaît — Capri est désormais l'application, avec son identifiant
            `com.flowframes.android.capri`, donc la mise à jour se fait par-dessus la 1.7.x.

            Nouveau en 1.8.0 : un onglet **Create** pour la génération d'images sur l'appareil.
            Les modèles ne sont pas dans l'APK : on importe un checkpoint (.safetensors, .ckpt ou
            .gguf — SD 1.5, SDXL, SD-Turbo, LCM) depuis le stockage du téléphone, il est copié dans
            le dossier privé de l'application, puis le moteur stable-diffusion.cpp (ggml, CPU) rend
            l'image en local, sans réseau. Prompt, prompt négatif, taille, étapes, CFG, sampler et
            graine sont réglables, la progression s'affiche pas à pas, et le PNG part dans
            Download/capri (MediaStore, sans permission de stockage). L'onglet Studio garde
            l'interpolation RIFE et l'onglet Settings ses réglages.

            Le build natif récupère stable-diffusion.cpp à une version épinglée (tag
            `master-1024-77b72a2`) et le compile pour arm64 avec le NDK : la première compilation
            est plus longue, les suivantes sont mises en cache par Gradle.

            Signature v1 + v2 + v3 avec la clé de release Capri/FlowFrames : inutile de re-signer.
            Désinstaller une fois l'ancienne version si Android refuse l'installation (clé
            différente).
