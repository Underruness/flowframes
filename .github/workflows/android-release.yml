name: Android APK release

on:
  push:
    tags: ['android-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install NDK r30 and CMake (SDK preinstalled on the runner)
        run: |
          SDKM=$(ls -d $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | $SDKM --licenses > /dev/null || true
          $SDKM "ndk;30.0.16248370" "cmake;3.22.1" "platforms;android-34" "build-tools;34.0.0" > /dev/null
          echo "sdk.dir=$ANDROID_HOME" > local.properties
      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk FlowFrames-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: FlowFrames-Android-apk
          path: android/FlowFrames-Android.apk
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: android/FlowFrames-Android.apk
          prerelease: true
          name: FlowFrames Android ${{ github.ref_name }}
          body: "APK arm64 : RIFE sur le GPU via ncnn + Vulkan, repli automatique sur CPU. Signé avec une clé de debug : désinstaller l'ancienne version si l'installation est refusée."
