name: Android APK release

on:
  push:
    tags: ['android-v*']
    # A branch named release/android-vX.Y.Z publishes that release too: the APKs are built from an
    # environment that can push branches but not tags, and the workflow creates the tag itself.
    branches: ['release/android-*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install NDK r30 and CMake (SDK preinstalled on the runner)
        run: |
          SDKM=$(ls -d $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | $SDKM --licenses > /dev/null || true
          $SDKM "ndk;30.0.16248370" "cmake;3.22.1" "platforms;android-34" "build-tools;34.0.0" > /dev/null
          echo "sdk.dir=$ANDROID_HOME" > local.properties
      - name: Release signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > release.jks
            printf 'storeFile=../release.jks\nstorePassword=%s\nkeyAlias=flowframes\nkeyPassword=%s\n' \
              "$KEYSTORE_PASSWORD" "$KEYSTORE_PASSWORD" > keystore.properties
          else
            echo "No release key secret: the APK is signed with the debug key"
          fi
      - name: Build the release APK (Capri)
        # CMake downloads the pinned ncnn prebuilt on the first configure and compiles the RIFE
        # engine for arm64; image generation was dropped in 1.8.1, so nothing else is fetched.
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          cp app/build/outputs/apk/release/app-release.apk Capri-Android.apk
          if [ -f keystore.properties ]; then
            # Gradle drops the v1 (JAR) signature when minSdk >= 24, but some installers (Honor
            # MagicOS) only read v1 and refuse the APK ("does not contain any certificates").
            # Re-sign with v1 + v2 + v3.
            PW=$(grep '^storePassword=' keystore.properties | cut -d= -f2-)
            $BT/zipalign -f -p 4 Capri-Android.apk aligned.apk
            $BT/apksigner sign --ks release.jks --ks-pass "pass:$PW" --ks-key-alias flowframes \
              --key-pass "pass:$PW" --min-sdk-version 21 --v1-signing-enabled true \
              --v2-signing-enabled true --v3-signing-enabled true --out Capri-Android.apk aligned.apk
            rm -f aligned.apk Capri-Android.apk.idsig
          fi
          $BT/apksigner verify --verbose --print-certs --min-sdk-version 21 Capri-Android.apk | head -8
          $BT/apksigner verify --min-sdk-version 21 -v Capri-Android.apk | grep -q "v1 scheme (JAR signing): true" || [ ! -f keystore.properties ]
          ls -l Capri-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Capri-Android-apk
          path: android/Capri-Android.apk
      - name: Resolve the release tag
        if: startsWith(github.ref, 'refs/tags/android-v') || startsWith(github.ref, 'refs/heads/release/')
        run: |
          if [ "$GITHUB_REF_TYPE" = "branch" ]; then
            echo "RELEASE_TAG=${GITHUB_REF_NAME#release/}" >> "$GITHUB_ENV"
          else
            echo "RELEASE_TAG=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          fi
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/android-v') || startsWith(github.ref, 'refs/heads/release/')
        uses: softprops/action-gh-release@v2
        with:
          # Pushed from a branch (which cannot carry a tag): create the tag at this commit.
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          files: android/Capri-Android.apk
          prerelease: true
          name: Capri ${{ env.RELEASE_TAG }}
          body: |
            Un seul APK arm64 dans cette release : **Capri-Android.apk**. L'édition historique
            FlowFrames disparaît — Capri est désormais l'application, avec son identifiant
            `com.flowframes.android.capri`, donc la mise à jour se fait par-dessus la 1.7.x.

            Nouveau en 1.8.4 : le NPU reçoit un modèle qu'il peut réellement exécuter.
            L'export standard laissait ses 14 `GridSample` sur le CPU — 1240 ms, plus lent que le CPU
            pur, avec une sortie identique au bit près : le signe qu'aucun nœud n'était réclamé.
            `tools/qnn_rewrite.py` remplace chaque warping par des indices entiers, quatre
            `GatherElements` et les poids bilinéaires ; le graphe passe de 412 à 1784 nœuds et
            l'écart mesuré contre l'original est de 1e-4 en fp32. La ligne `QNN (NPU) … GatherElements
            export` du benchmark mesure cet export ; les autres lignes gardent le modèle d'origine.

            Nouveau en 1.8.3 : le **benchmark intégré mesure le NPU**, sur la même image et le même
            fichier `.onnx` que la référence CPU, avec **une seule session** (le HTP n'exécute qu'un
            graphe à la fois) et 300 s de budget, parce que le premier run compile le graphe pour le
            DSP. La ligne `ONNX Runtime QNN (NPU) 1 × 4T` donne les ms/frame du Hexagon et l'effet du
            découpage : ce que le HTP ne sait pas exécuter (`GridSample`) reste sur le CPU.

            Nouveau en 1.8.1 : l'onglet **Create** et le moteur de génération d'images sont retirés.
            Capri redevient une application d'interpolation seule, sans les dépendances natives de la
            diffusion.

            Nouveau aussi : le **NPU Hexagon**. ONNX Runtime est désormais bâti avec l'execution
            provider QNN et le runtime Hexagon est embarqué (HTP v68 à v81), donc le modèle RIFE
            peut tourner sur le NPU Snapdragon avec le **même fichier .onnx**, sans conversion et
            sans SDK Qualcomm à la compilation. Les opérateurs que le HTP ne sait pas exécuter (le
            warping `GridSample` notamment) restent sur le CPU dans la même session : ONNX Runtime
            découpe le graphe.

            Pour tester : **Settings → Engine → ONNX Runtime**, puis lancer une interpolation. Le
            journal indique `ORT: QNN enabled (Hexagon NPU, HTP fp16)` et le nombre de sessions ; le
            self-test PSNR de démarrage rejette le moteur si le NPU renvoie une image fausse, et le
            job retombe alors sur le GPU/CPU. Coût : l'APK grossit (le runtime Hexagon et son
            compilateur de graphe pèsent une centaine de mégaoctets).

            Signature v1 + v2 + v3 avec la clé de release Capri/FlowFrames : inutile de re-signer.
            Désinstaller une fois l'ancienne version si Android refuse l'installation (clé
            différente).
