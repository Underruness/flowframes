name: Android APK release

on:
  push:
    tags: ['android-v*']
    # A branch named release/android-vX.Y.Z publishes that release too: the APKs are built from an
    # environment that can push branches but not tags, and the workflow creates the tag itself.
    branches: ['release/android-*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install NDK r30 and CMake (SDK preinstalled on the runner)
        run: |
          SDKM=$(ls -d $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | $SDKM --licenses > /dev/null || true
          $SDKM "ndk;30.0.16248370" "cmake;3.22.1" "platforms;android-34" "build-tools;34.0.0" > /dev/null
          echo "sdk.dir=$ANDROID_HOME" > local.properties
      - name: Release signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > release.jks
            printf 'storeFile=../release.jks\nstorePassword=%s\nkeyAlias=flowframes\nkeyPassword=%s\n' \
              "$KEYSTORE_PASSWORD" "$KEYSTORE_PASSWORD" > keystore.properties
          else
            echo "No release key secret: the APK is signed with the debug key"
          fi
      - name: Build the release APKs (FlowFrames + Capri)
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          cp app/build/outputs/apk/flowframes/release/app-flowframes-release.apk FlowFrames-Android.apk
          cp app/build/outputs/apk/capri/release/app-capri-release.apk Capri-Android.apk
          for apk in FlowFrames-Android.apk Capri-Android.apk; do
            echo "=== $apk"
            if [ -f keystore.properties ]; then
              # Gradle drops the v1 (JAR) signature when minSdk >= 24, but some installers (Honor
              # MagicOS) only read v1 and refuse the APK ("does not contain any certificates").
              # Re-sign with v1 + v2 + v3.
              PW=$(grep '^storePassword=' keystore.properties | cut -d= -f2-)
              $BT/zipalign -f -p 4 "$apk" aligned.apk
              $BT/apksigner sign --ks release.jks --ks-pass "pass:$PW" --ks-key-alias flowframes \
                --key-pass "pass:$PW" --min-sdk-version 21 --v1-signing-enabled true \
                --v2-signing-enabled true --v3-signing-enabled true --out "$apk" aligned.apk
              rm -f aligned.apk "$apk.idsig"
            fi
            $BT/apksigner verify --verbose --print-certs --min-sdk-version 21 "$apk" | head -8
            $BT/apksigner verify --min-sdk-version 21 -v "$apk" | grep -q "v1 scheme (JAR signing): true" || [ ! -f keystore.properties ]
          done
      - uses: actions/upload-artifact@v4
        with:
          name: FlowFrames-Android-apk
          path: |
            android/FlowFrames-Android.apk
            android/Capri-Android.apk
      - name: Resolve the release tag
        if: startsWith(github.ref, 'refs/tags/android-v') || startsWith(github.ref, 'refs/heads/release/')
        run: |
          if [ "$GITHUB_REF_TYPE" = "branch" ]; then
            echo "RELEASE_TAG=${GITHUB_REF_NAME#release/}" >> "$GITHUB_ENV"
          else
            echo "RELEASE_TAG=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          fi
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/android-v') || startsWith(github.ref, 'refs/heads/release/')
        uses: softprops/action-gh-release@v2
        with:
          # Pushed from a branch (which cannot carry a tag): create the tag at this commit.
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          files: |
            android/FlowFrames-Android.apk
            android/Capri-Android.apk
          prerelease: true
          name: FlowFrames Android ${{ env.RELEASE_TAG }}
          body: |
            Deux APK arm64 dans cette release :

            * **FlowFrames-Android.apk** — l'application historique : interpolation RIFE sur le GPU via
              ncnn + Vulkan, repli automatique sur le CPU si le pilote échoue.
            * **Capri-Android.apk** — l'édition Capri : palette Material You du système (couleurs tirées
              du fond d'écran sur Android 12+), logo et icônes à elle, cartes arrondies, en-tête fin et
              file d'attente qui ne se chevauche plus sur un petit écran. Mêmes moteurs et mêmes
              réglages ; elle s'installe à côté de FlowFrames (identifiant distinct), les deux peuvent
              donc coexister.

            Les deux APK sont signés (v1 + v2 + v3, compatible avec l'installateur Honor) avec la clé de
            release FlowFrames : inutile de les re-signer. Désinstaller une fois l'ancienne version si
            Android refuse l'installation (clé différente).

            Depuis la 1.6.6, le moteur GPU est préparé au démarrage de l'application : le premier
            lancement compile les shaders et convertit les poids en arrière-plan, puis chaque
            interpolation démarre immédiatement. Les inférences parallèles se règlent avec un curseur
            (2 par défaut).

            Nouveau en 1.7.1 : retour à l'interface Capri de la 1.6.6, avec les deux défauts du menu
            principal corrigés — l'en-tête dégradé passe d'environ 180 dp à environ 80 dp (plus de gros
            bloc lumineux) et les cartes de la file ne peuvent plus se chevaucher (le nom a sa ligne,
            l'état et les métadonnées la suivante, tronqués proprement).

            Le moteur de la 1.7.0 reste : les trois conversions de pixels de chaque image générée (deux
            entrées ARGB, une sortie) sont réparties sur plusieurs threads au lieu de s'enchaîner — 58 %
            de ce coût CPU en moins en 1080p, 68 % en 4K (mesuré sur machine hôte, sur les boucles exactes
            du téléphone).
