name: Android UI tests

# Runs the instrumented Compose smoke tests (Capri) on a real Android emulator, so a
# release never ships an UI that does not even inflate. The emulator needs KVM: the machine that
# builds the APKs has none (and no emulator package), so these tests can only run here.
#
# Every emulator step is written out by hand instead of using a third-party action, and the commands
# that can fail report their own output as a check annotation: a workflow run is readable without
# authentication, its logs are not, and "exit code 1" alone says nothing about what broke.
on:
  push:
    branches: ['main', 'android-*', 'release/android-*']
    paths:
      - 'android/**'
      - '.github/workflows/android-ui-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  API_LEVEL: 34
  IMAGE_TARGET: google_apis
  IMAGE_ARCH: x86_64
  AVD_NAME: ci34
  # avdmanager writes the AVD wherever ANDROID_USER_HOME points on this image while the emulator
  # looks it up in a third place: the first attempt created an empty directory and "no AVD found".
  # Both tools now agree on this one.
  ANDROID_AVD_HOME: /home/runner/.android/avd

jobs:
  ui-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          accel=$($ANDROID_HOME/emulator/emulator -accel-check 2>&1 | tr '\n' ' ' || true)
          echo "::notice title=KVM::$(ls -l /dev/kvm 2>&1 | tr '\n' ' ') — accel-check: $accel"

      - name: Install the SDK pieces and the emulator image
        run: |
          SDKM=$(ls -d $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | $SDKM --licenses > /dev/null || true
          $SDKM "ndk;30.0.16248370" "cmake;3.22.1" "platforms;android-34" "build-tools;34.0.0" \
            "emulator" "system-images;android-$API_LEVEL;$IMAGE_TARGET;$IMAGE_ARCH"
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          df -h / | tail -1

      - name: Create the AVD
        run: |
          AVDM=$(ls -d $ANDROID_HOME/cmdline-tools/*/bin/avdmanager | sort -V | tail -1)
          IMAGE="system-images;android-$API_LEVEL;$IMAGE_TARGET;$IMAGE_ARCH"
          mkdir -p "$ANDROID_AVD_HOME"
          created=0
          for extra in "-d pixel_5" ""; do
            if out=$(echo no | $AVDM create avd -n "$AVD_NAME" -k "$IMAGE" $extra --force \
                     --path "$ANDROID_AVD_HOME/$AVD_NAME.avd" 2>&1); then
              echo "$out"
              echo "::notice title=AVD::créé dans $ANDROID_AVD_HOME/$AVD_NAME.avd avec [$extra]"
              created=1
              break
            fi
            echo "::error title=avdmanager [$extra]::$(echo "$out" | tr '\n' '|' | head -c 800)"
          done
          if [ "$created" != "1" ]; then
            echo "::error title=AVD::creation impossible — $(ls -la $ANDROID_HOME 2>&1 | tr '\n' '|' | head -c 400)"
            exit 1
          fi
          # 2 GB of RAM: Compose plus MediaCodec are heavier than the default profile.
          cfg="$ANDROID_AVD_HOME/$AVD_NAME.avd/config.ini"
          if [ ! -f "$cfg" ]; then
            echo "::error title=avd config::pas de config.ini — $(ls -laR "$ANDROID_AVD_HOME" 2>&1 | tr '\n' '|' | head -c 500)"
            exit 1
          fi
          printf 'hw.ramSize=2048\nhw.keyboard=yes\ndisk.dataPartition.size=4096M\n' >> "$cfg"
          echo "::notice title=avd config::$cfg — $(grep -E 'hw.ramSize|hw.keyboard|image.sysdir|hw.lcd.width' "$cfg" | tr '\n' ' ')"

      - name: Boot the emulator
        run: |
          # Absolute paths: the first attempt died in a second because adb was not on this shell's
          # PATH, which said nothing about the emulator it was supposed to talk to.
          ADB="$ANDROID_HOME/platform-tools/adb"
          EMU="$ANDROID_HOME/emulator/emulator"
          for tool in "$ADB" "$EMU"; do
            [ -x "$tool" ] || { echo "::error title=outillage::absent: $tool"; exit 1; }
          done
          nohup "$EMU" -avd "$AVD_NAME" -no-window -no-audio -no-boot-anim -no-snapshot \
            -gpu swiftshader_indirect -camera-back none -camera-front none \
            > /tmp/emulator.log 2>&1 &
          for i in $(seq 1 60); do
            "$ADB" devices | grep -q 'emulator-' && break
            sleep 5
          done
          "$ADB" wait-for-device
          boot=""
          for i in $(seq 1 120); do
            boot=$("$ADB" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            [ "$boot" = "1" ] && break
            sleep 5
          done
          "$ADB" devices
          echo "::notice title=boot::sys.boot_completed=$boot"
          if [ "$boot" != "1" ]; then
            echo "::error title=émulateur::$(tail -25 /tmp/emulator.log | tr '\n' '|' | head -c 900)"
            exit 1
          fi

      # The emulator images are x86_64, so the native engine is built for x86_64 too: one APK carries
      # one ABI, and the arm64 APK shipped to users cannot be installed on an x86_64 emulator.
      - name: Run the instrumented UI smoke tests
        run: |
          cd android
          chmod +x gradlew
          set +e
          ./gradlew --no-daemon connectedDebugAndroidTest \
            -Pabis=x86_64 \
            -Pandroid.testInstrumentationRunnerArguments.class=com.flowframes.android.UiSmokeTest \
            > /tmp/gradle-tests.log 2>&1
          code=$?
          tail -60 /tmp/gradle-tests.log
          if [ "$code" != "0" ]; then
            echo "::error title=tests UI::$(grep -E 'FAILED|failed|AssertionError|Error|error:' /tmp/gradle-tests.log \
              | head -12 | tr '\n' '|' | head -c 900)"
          fi
          exit $code

      - name: Emulator and device logs
        if: always()
        run: |
          echo "=== emulator.log (tail) ==="
          tail -80 /tmp/emulator.log || true
          echo "=== logcat (tail) ==="
          "$ANDROID_HOME/platform-tools/adb" logcat -d -t 300 || true

      - name: Upload the test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-ui-test-reports
          path: |
            android/app/build/reports/androidTests/connected/**
            /tmp/gradle-tests.log
          if-no-files-found: ignore
