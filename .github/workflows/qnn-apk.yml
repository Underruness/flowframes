name: QNN APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/qnn-apk.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout the QNN commit
        uses: actions/checkout@v4
        with:
          ref: 877d7147ae0cab5392b5662a54845eda06141e56
          lfs: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses > /dev/null

      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Build the QNN HTP V81 APK
        working-directory: android
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew assembleRelease -Pqnn=true --no-daemon

      - name: Attach the APK to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk FlowFrames-1.4.0-qnn-v81.apk
          curl --fail --silent --show-error --location \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Content-Type: application/vnd.android.package-archive" \
            --data-binary @FlowFrames-1.4.0-qnn-v81.apk \
            "https://uploads.github.com/repos/Underruness/flowframes/releases/445618239/assets?name=FlowFrames-1.4.0-qnn-v81.apk"
